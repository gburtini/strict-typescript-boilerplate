rules:
  - id: no-eval-or-dynamic-function
    languages:
      - javascript
      - typescript
    message: Do not execute dynamically constructed JavaScript.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: Function(...)
          - pattern: new Function(...)

  - id: no-hardcoded-credential-assignment
    languages:
      - javascript
      - typescript
    message: Do not hardcode credentials; read them from a validated secret boundary.
    severity: ERROR
    patterns:
      - pattern: $KEY = "$VALUE"
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(password|passwd|secret|token|api[_-]?key).*
      - metavariable-regex:
          metavariable: $VALUE
          regex: .{8,}

  - id: no-dangerous-child-process-shell
    languages:
      - javascript
      - typescript
    message: Avoid shell interpolation in child-process calls; pass arguments separately.
    severity: ERROR
    pattern-either:
      - patterns:
          - pattern-inside: |
              import { exec as $CALL } from "node:child_process";
              ...
          - pattern: $CALL(...)
      - patterns:
          - pattern-inside: |
              import { exec } from "node:child_process";
              ...
          - pattern: exec(...)
      - patterns:
          - pattern-inside: |
              import * as $PROCESS from "node:child_process";
              ...
          - pattern: $PROCESS.exec(...)
      - patterns:
          - pattern-inside: |
              import $PROCESS from "node:child_process";
              ...
          - pattern: $PROCESS.exec(...)
      - patterns:
          - pattern-inside: |
              import { execSync as $CALL } from "node:child_process";
              ...
          - pattern: $CALL(...)
      - patterns:
          - pattern-inside: |
              import { execSync } from "node:child_process";
              ...
          - pattern: execSync(...)
      - patterns:
          - pattern-inside: |
              import * as $PROCESS from "node:child_process";
              ...
          - pattern: $PROCESS.execSync(...)
      - patterns:
          - pattern-inside: |
              import $PROCESS from "node:child_process";
              ...
          - pattern: $PROCESS.execSync(...)
      - patterns:
          - pattern-inside: |
              import { exec as $CALL } from "child_process";
              ...
          - pattern: $CALL(...)
      - patterns:
          - pattern-inside: |
              import { exec } from "child_process";
              ...
          - pattern: exec(...)
      - patterns:
          - pattern-inside: |
              import * as $PROCESS from "child_process";
              ...
          - pattern: $PROCESS.exec(...)
      - patterns:
          - pattern-inside: |
              import $PROCESS from "child_process";
              ...
          - pattern: $PROCESS.exec(...)
      - patterns:
          - pattern-inside: |
              import { execSync as $CALL } from "child_process";
              ...
          - pattern: $CALL(...)
      - patterns:
          - pattern-inside: |
              import { execSync } from "child_process";
              ...
          - pattern: execSync(...)
      - patterns:
          - pattern-inside: |
              import * as $PROCESS from "child_process";
              ...
          - pattern: $PROCESS.execSync(...)
      - patterns:
          - pattern-inside: |
              import $PROCESS from "child_process";
              ...
          - pattern: $PROCESS.execSync(...)

  - id: no-empty-catch
    languages:
      - javascript
      - typescript
    message: Catch blocks must report, translate, or rethrow the failure.
    severity: ERROR
    pattern-either:
      - pattern: |
          try { ... } catch ($ERROR) {}
      - pattern: |
          try { ... } catch {}

  - id: throw-error-values
    languages:
      - javascript
      - typescript
    message: Throw an Error or a typed application failure, never a string or arbitrary value.
    severity: ERROR
    pattern-either:
      - pattern: throw "..."
      - pattern: throw true
      - pattern: throw false
      - pattern: throw null
      - pattern: throw undefined
      - pattern: "throw { ... }"
      - pattern: "throw [ ... ]"
      - patterns:
          - pattern: throw $NUMBER
          - metavariable-regex:
              metavariable: $NUMBER
              regex: '^[+-]?(?:\d+(?:\.\d+)?|\.\d+)$'

  - id: catch-wrapping-preserves-cause
    languages:
      - javascript
      - typescript
    message: "Wrapped errors must preserve an enclosing caught failure as their cause."
    severity: ERROR
    pattern-either:
      - patterns:
          - pattern-inside: |
              try { ... } catch ($CAUGHT) { ... }
          - pattern: throw new $WRAPPER(...)
          - pattern-not: "throw new $WRAPPER(..., { ..., cause: $CAUSE, ... }, ...)"
      - patterns:
          - pattern-inside: |
              try { ... } catch ($CAUGHT) { ... }
          - pattern: "throw new $WRAPPER(..., { ..., cause: $CAUSE, ... }, ...)"
          - pattern-not-inside: |
              try { ... } catch ($CAUSE) { ... }
          - pattern-not-inside: |
              try { ... } catch ($CAUSE: $TYPE) { ... }

  - id: no-raw-fetch
    languages:
      - javascript
      - typescript
    message: Use an injected HTTP adapter; raw fetch is forbidden in application and domain code.
    severity: ERROR
    metadata:
      enforcement: boundary
    paths:
      exclude:
        - /apps/web/src/adapters/registration-client.ts
    pattern-either:
      - pattern: fetch(...)
      - pattern: globalThis.fetch(...)
      - pattern: window.fetch(...)

  - id: no-unbounded-promise-all-map
    languages:
      - javascript
      - typescript
    message: Use an explicit bounded collection helper rather than Promise collection directly over map.
    severity: ERROR
    pattern-either:
      - pattern: Promise.all($ITEMS.map($CALLBACK))
      - pattern: Promise.allSettled($ITEMS.map($CALLBACK))

  - id: no-string-timers
    languages: [javascript, typescript]
    message: Timer callbacks must be functions, never strings.
    severity: ERROR
    pattern-either:
      - pattern: setTimeout("...", ...)
      - pattern: setInterval("...", ...)
      - pattern: globalThis.setTimeout("...", ...)
      - pattern: globalThis.setInterval("...", ...)
      - pattern: window.setTimeout("...", ...)
      - pattern: window.setInterval("...", ...)

  - id: no-testing-library-query-defined-assertion
    languages: [javascript, typescript]
    message: Testing Library queries already fail when unmatched; assert expected content or state instead of calling toBeDefined().
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: expect($SCREEN.$QUERY_METHOD(...)).toBeDefined()
          - pattern: await expect($SCREEN.$QUERY_METHOD(...)).resolves.toBeDefined()
      - metavariable-regex:
          metavariable: $QUERY_METHOD
          regex: ^(?:getBy|findBy).+$

  - id: react-component-name-pascal-case
    languages: [javascript, typescript]
    message: Functions returning React elements are components; use a PascalCase name so JSX treats the function as a component.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: "function $NAME(...): $RETURN { ... }"
          - pattern: "const $NAME = (...): $RETURN => { ... }"
      - metavariable-regex:
          metavariable: $NAME
          regex: ^[a-z].*$
      - metavariable-regex:
          metavariable: $RETURN
          regex: (?:ReactElement|ReactNode|JSX\.Element)

  - id: react-component-returns-null-not-false
    languages: [javascript, typescript]
    message: React components must return null when they render nothing; false is not a component return value.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern-inside: "function $NAME(...): $RETURN { ... }"
          - pattern-inside: "const $NAME = (...): $RETURN => { ... }"
      - metavariable-regex:
          metavariable: $RETURN
          regex: (?:ReactElement|ReactNode|JSX\.Element)
      - pattern-either:
          - pattern: "return false;"
          - pattern: "return $CONDITION ? $ELEMENT : false;"
          - pattern: "return $CONDITION ? false : $ELEMENT;"

  - id: one-exported-react-component-per-file
    languages: [javascript, typescript]
    message: Export at most one React component per file; keep cohesive supporting components private.
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              export function $FIRST(...): $FIRST_RETURN { ... }
              ...
              export function $SECOND(...): $SECOND_RETURN { ... }
          - pattern: |
              export const $FIRST = (...): $FIRST_RETURN => { ... };
              ...
              export const $SECOND = (...): $SECOND_RETURN => { ... };
          - pattern: |
              export function $FIRST(...): $FIRST_RETURN { ... }
              ...
              export const $SECOND = (...): $SECOND_RETURN => { ... };
          - pattern: |
              export const $FIRST = (...): $FIRST_RETURN => { ... };
              ...
              export function $SECOND(...): $SECOND_RETURN { ... }
      - metavariable-regex:
          metavariable: $FIRST_RETURN
          regex: (?:ReactElement|ReactNode|JSX\.Element)
      - metavariable-regex:
          metavariable: $SECOND_RETURN
          regex: (?:ReactElement|ReactNode|JSX\.Element)

  - id: no-child-process-shell
    languages: [javascript, typescript]
    message: Subprocess options must not enable a shell; omit shell or set it to false.
    severity: ERROR
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  import { spawn as $CALL } from "node:child_process";
                  ...
              - pattern: "$CALL(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import { spawn } from "node:child_process";
                  ...
              - pattern: "spawn(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import * as $PROCESS from "node:child_process";
                  ...
              - pattern: "$PROCESS.spawn(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import $PROCESS from "node:child_process";
                  ...
              - pattern: "$PROCESS.spawn(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import { spawnSync as $CALL } from "node:child_process";
                  ...
              - pattern: "$CALL(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import { spawnSync } from "node:child_process";
                  ...
              - pattern: "spawnSync(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import * as $PROCESS from "node:child_process";
                  ...
              - pattern: "$PROCESS.spawnSync(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import $PROCESS from "node:child_process";
                  ...
              - pattern: "$PROCESS.spawnSync(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import { execFile as $CALL } from "node:child_process";
                  ...
              - pattern: "$CALL(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import { execFile } from "node:child_process";
                  ...
              - pattern: "execFile(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import * as $PROCESS from "node:child_process";
                  ...
              - pattern: "$PROCESS.execFile(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import $PROCESS from "node:child_process";
                  ...
              - pattern: "$PROCESS.execFile(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import { execFileSync as $CALL } from "node:child_process";
                  ...
              - pattern: "$CALL(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import { execFileSync } from "node:child_process";
                  ...
              - pattern: "execFileSync(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import * as $PROCESS from "node:child_process";
                  ...
              - pattern: "$PROCESS.execFileSync(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import $PROCESS from "node:child_process";
                  ...
              - pattern: "$PROCESS.execFileSync(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import { spawn as $CALL } from "child_process";
                  ...
              - pattern: "$CALL(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import { spawn } from "child_process";
                  ...
              - pattern: "spawn(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import * as $PROCESS from "child_process";
                  ...
              - pattern: "$PROCESS.spawn(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import $PROCESS from "child_process";
                  ...
              - pattern: "$PROCESS.spawn(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import { spawnSync as $CALL } from "child_process";
                  ...
              - pattern: "$CALL(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import { spawnSync } from "child_process";
                  ...
              - pattern: "spawnSync(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import * as $PROCESS from "child_process";
                  ...
              - pattern: "$PROCESS.spawnSync(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import $PROCESS from "child_process";
                  ...
              - pattern: "$PROCESS.spawnSync(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import { execFile as $CALL } from "child_process";
                  ...
              - pattern: "$CALL(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import { execFile } from "child_process";
                  ...
              - pattern: "execFile(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import * as $PROCESS from "child_process";
                  ...
              - pattern: "$PROCESS.execFile(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import $PROCESS from "child_process";
                  ...
              - pattern: "$PROCESS.execFile(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import { execFileSync as $CALL } from "child_process";
                  ...
              - pattern: "$CALL(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import { execFileSync } from "child_process";
                  ...
              - pattern: "execFileSync(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import * as $PROCESS from "child_process";
                  ...
              - pattern: "$PROCESS.execFileSync(..., { ..., shell: $SHELL, ... }, ...)"
          - patterns:
              - pattern-inside: |
                  import $PROCESS from "child_process";
                  ...
              - pattern: "$PROCESS.execFileSync(..., { ..., shell: $SHELL, ... }, ...)"
      - metavariable-regex:
          metavariable: $SHELL
          regex: ^(?!false$).+$

  - id: no-disabled-tls-verification
    languages: [javascript, typescript]
    message: TLS certificate verification must not be disabled.
    severity: ERROR
    pattern-either:
      - pattern: "{ ..., rejectUnauthorized: false, ... }"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  - id: no-direct-process-env
    languages: [javascript, typescript]
    message: Read environment variables only in a reviewed configuration boundary.
    severity: ERROR
    metadata:
      enforcement: boundary
    paths:
      exclude:
        - /apps/web/server/env.ts
        - /apps/web/playwright.config.ts
        - /packages/db/src/env.ts
        - /packages/db/src/client.ts
        - /packages/db/src/query-capture.ts
        - /devtools/scripts/database/prepare-query-plans.ts
        - /devtools/scripts/database/reset-query-plan-database.ts
        - /devtools/scripts/database/run-query-plans.ts
        - /devtools/scripts/database/export-query-plan-stats.ts
        - /devtools/scripts/database/verify-database.ts
    pattern: process.env
