name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    # CodeQL result uploads are unavailable while this repository is private
    # without GitHub Code Security enabled. Keep the workflow ready for when
    # the repository becomes eligible rather than turning upload failures into
    # a passing check.
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.0.0
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.0.0
        with:
          category: /language:javascript-typescript
