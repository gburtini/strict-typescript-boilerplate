name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - id: init
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.0.0
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Run CodeQL queries
        shell: bash
        run: |
          set -euo pipefail
          codeql="${{ steps.init.outputs.codeql-path }}"
          database="${RUNNER_TEMP}/codeql_databases/javascript"
          results="${RUNNER_TEMP}/codeql-results"
          mkdir -p "${results}"
          "${codeql}" database trace-command \
            --use-build-mode \
            --working-dir="${GITHUB_WORKSPACE}" \
            "${database}" \
            "${codeql%/codeql}/javascript/tools/autobuild.sh"
          "${codeql}" database finalize "${database}"
          "${codeql}" database analyze "${database}" \
            --download \
            --format=sarif-latest \
            --output="${results}/javascript.sarif" \
            --threads=2 \
            javascript-security-and-quality.qls
      - name: Summarize CodeQL results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sarif="${RUNNER_TEMP}/codeql-results/javascript.sarif"
          if [[ ! -s "${sarif}" ]]; then
            echo "## CodeQL results" >> "${GITHUB_STEP_SUMMARY}"
            echo "CodeQL did not produce a SARIF report." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          findings="$(jq '[.runs[]?.results[]?] | length' "${sarif}")"
          {
            echo "## CodeQL results"
            echo "Findings: ${findings}"
            if [[ "${findings}" -gt 0 ]]; then
              echo
              echo '| Rule | Message | Location |'
              echo '| --- | --- | --- |'
              jq -r '.runs[]?.results[]? | [(.ruleId // "unknown"), (.message.text // "" | gsub("\\n"; " ")), ((.locations[0].physicalLocation.artifactLocation.uri // "unknown") + ":" + ((.locations[0].physicalLocation.region.startLine // 0) | tostring))] | "| " + join(" | ") + " |"' "${sarif}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload CodeQL results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-results
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: warn
          retention-days: 14
