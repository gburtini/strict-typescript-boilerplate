name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime
            script: check:runtime
          - name: toolchain
            script: toolchain:check
          - name: format
            script: format:check
          - name: API exports
            script: api:check
          - name: database migrations
            script: db:migrations:check
          - name: typecheck
            script: typecheck
          - name: lint
            script: lint
          - name: exceptions
            script: exceptions:check
          - name: enforcement fixtures
            script: enforcement:fixtures
          - name: architecture fixtures
            script: architecture:fixtures
          - name: CI policy
            script: ci:policy
          - name: generated files
            script: generated:check
          - name: test evidence
            script: test:evidence
          - name: enforcement manifest
            script: enforcement:manifest:check
          - name: dead code
            script: deadcode
          - name: dependencies
            script: deps
          - name: packages
            script: packages
          - name: unit tests
            script: test
          - name: build
            script: build
          - name: end-to-end tests
            script: test:e2e
          - name: full repository gate
            script: check:all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        if: matrix.name == 'end-to-end tests' || matrix.name == 'full repository gate'
        run: pnpm --filter @template/web exec playwright install --with-deps chromium
      - name: Build application for E2E
        if: matrix.name == 'end-to-end tests'
        run: pnpm build
      - name: Run check
        if: matrix.name != 'full repository gate'
        run: pnpm run ${{ matrix.script }}
      - name: Run full repository gate
        if: matrix.name == 'full repository gate'
        run: pnpm check:all
