name: Check

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  repository:
    name: Local repository contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser runtime
        run: pnpm --filter @template/web exec playwright install --with-deps chromium
      - run: pnpm check:all
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: acceptance-evidence
          path: |
            apps/web/test-results
            .artifacts
          if-no-files-found: error
          retention-days: 14
  initialization:
    name: Initialized project contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser runtime
        run: pnpm --filter @template/web exec playwright install --with-deps chromium
      - run: pnpm initialization:smoke
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: initialized-project-evidence
          path: .artifacts/initialization-smoke-*
          if-no-files-found: error
          retention-days: 14
  semgrep:
    uses: ./.github/workflows/semgrep.yml
  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: read
  dependencies:
    uses: ./.github/workflows/dependency-review.yml
  plans:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/query-plans.yml
  actionlint:
    uses: ./.github/workflows/actionlint.yml
  osv:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: ./.github/workflows/osv-scanner.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  acceptance:
    name: Repository acceptance
    if: always()
    needs:
      [
        repository,
        initialization,
        semgrep,
        codeql,
        dependencies,
        plans,
        actionlint,
        osv,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable gate
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -e --arg event "$EVENT_NAME" '
            to_entries | all(.[];
              .value.result == "success" or
              (.key == "plans" and $event != "pull_request" and .value.result == "skipped") or
              (.key == "osv" and $event != "pull_request" and $event != "merge_group" and .value.result == "skipped"))'
