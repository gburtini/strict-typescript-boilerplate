name: Query Plans

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  query-plans:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planner_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d planner_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/planner_ci
      QUERY_PLAN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/planner_ci
      QUERY_PLAN_DISPOSABLE_DATABASE: planner_ci
    steps:
      - name: Check out base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Check out proposed merge
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          path: proposed
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: proposed/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            base/pnpm-lock.yaml
            proposed/pnpm-lock.yaml
      - name: Install base dependencies
        working-directory: base
        run: pnpm install --frozen-lockfile
      - name: Install proposed dependencies
        working-directory: proposed
        run: pnpm install --frozen-lockfile
      - name: Prepare base database
        working-directory: proposed
        run: pnpm db:plans:reset
      - name: Migrate and seed base database
        working-directory: base
        run: |
          pnpm db:migrate
          pnpm db:plans:prepare
      - name: Capture base query corpus
        working-directory: base
        run: pnpm test
        env:
          QUERY_PLAN_CAPTURE: "1"
          QUERY_PLAN_CORPUS_DIR: .artifacts
      - name: Capture base integration query corpus
        working-directory: base
        run: pnpm --filter @template/db test:integration
        env:
          QUERY_PLAN_CAPTURE: "1"
          QUERY_PLAN_CORPUS_DIR: .artifacts
      - name: Merge base query corpus
        working-directory: base
        run: pnpm db:query-corpus:merge
      - name: Generate base query plans
        working-directory: base
        env:
          QUERY_PLAN_BASELINE: ../.artifacts/query-plans-base.json
          QUERY_PLAN_OUTPUT: ../.artifacts/query-plans-base.md
          QUERY_PLAN_WRITE_BASELINE: "1"
        run: |
          mkdir -p ../.artifacts
          pnpm db:plans
      - name: Prepare proposed database
        working-directory: proposed
        run: pnpm db:plans:reset
      - name: Migrate and seed proposed database
        working-directory: proposed
        run: |
          pnpm db:migrate
          pnpm db:plans:prepare
      - name: Capture proposed query corpus
        working-directory: proposed
        run: pnpm test
        env:
          QUERY_PLAN_CAPTURE: "1"
          QUERY_PLAN_CORPUS_DIR: .artifacts
      - name: Capture proposed integration query corpus
        working-directory: proposed
        run: pnpm --filter @template/db test:integration
        env:
          QUERY_PLAN_CAPTURE: "1"
          QUERY_PLAN_CORPUS_DIR: .artifacts
      - name: Merge proposed query corpus
        working-directory: proposed
        run: pnpm db:query-corpus:merge
      - name: Compare proposed query plans with base
        working-directory: proposed
        env:
          QUERY_PLAN_BASELINE: ../.artifacts/query-plans-base.json
          QUERY_PLAN_OUTPUT: ../.artifacts/query-plans.md
        run: pnpm db:plans
      - name: Publish planner report
        if: always()
        run: |
          if [[ -f .artifacts/query-plans.md ]]; then
            cat .artifacts/query-plans.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Query plan report was not generated.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: query-plan-comparison
          path: .artifacts
          if-no-files-found: error
