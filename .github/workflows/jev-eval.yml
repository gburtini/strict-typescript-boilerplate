name: Jev semantic evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/jev-eval.yml"
      - "quality/semantic/**"
      - "devtools/scripts/repository/check-semantic-lint.ts"
      - "devtools/scripts/repository/semantic-lint-core.ts"
      - "devtools/scripts/repository/check-ci-policy.ts"
      - "docs/policies/ARCHITECTURE.md"
      - "docs/policies/CONVENTIONS.md"
      - "docs/policies/TESTING.md"
      - "AGENTS.md"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Jev evaluation against the pull request diff
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo "AI_GATEWAY_API_KEY is required for the Jev pull request check." >&2
            exit 1
          fi
          pnpm exec node --experimental-strip-types \
            devtools/scripts/repository/check-semantic-lint.ts \
            --base "$BASE_REF"
