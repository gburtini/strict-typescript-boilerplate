name: Jev semantic evaluation

on:
  push:
    branches: [main]
    paths:
      - "devtools/quality/semantic/**"
      - "devtools/scripts/repository/*semantic*"
      - ".github/workflows/jev-eval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Evaluate synthetic fixtures with trusted main evaluator
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo 'Semantic evaluation unavailable: Gateway secret is not configured.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pnpm lint:semantic:eval
