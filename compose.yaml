services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-typescript_boilerplate}
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      interval: 2s
      retries: 20
      test: ["CMD-SHELL", "pg_isready -U postgres -d $$POSTGRES_DB"]
      timeout: 5s
    ports:
      - "127.0.0.1::5432"
