packages:
  - "apps/*"
  - "packages/*"

# Do not consume newly published versions until they have had time for
# ecosystem and security review. Explicit exceptions require documentation.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@shadcn/lint"
  - "dependency-cruiser"
  - "enhanced-resolve"

# Keep the architecture checker on the TypeScript 7-compatible release. The
# explicit freshness exception is deliberate: this is a compiler/toolchain
# compatibility update, not a general dependency-age bypass.
